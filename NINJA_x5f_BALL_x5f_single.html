<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NINJA BALL v1.2</title>
<style>
:root{--bg:#000;--fg:#fff;--accent:#ff5a00;--card:#111}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
body{background:#000;color:#fff;overflow:hidden;touch-action:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:radial-gradient(ellipse at top,#1a0000,#000)}
.screen.active{display:flex}
.logo{font-size:48px;font-weight:900;text-align:center;margin-top:60px;letter-spacing:2px}
.logo span{color:var(--accent);text-shadow:0 0 20px #ff4500}
.mascot{width:140px;height:140px;margin:20px auto;border-radius:50%;object-fit:cover;border:2px solid #ff450033;box-shadow:0 0 40px #ff000033}
.buttons{display:flex;flex-direction:column;gap:12px;padding:0 40px;margin-top:10px}
button{background:#0a0a0a;border:1px solid #ff5a0033;color:#fff;padding:16px;border-radius:14px;font-size:18px;font-weight:700;letter-spacing:1px}
button:active{transform:scale(.98);background:#1a0a00}
.footer{margin-top:auto;text-align:center;padding:12px;color:#ff9d66;font-size:12px}
header{display:flex;align-items:center;gap:10px;padding:12px;background:#0a0a0a;border-bottom:1px solid #222}
header h2{flex:1;font-size:18px}
.filters button{padding:6px 10px;font-size:13px;border-radius:8px;margin-left:4px;background:#111}
.filters button.active{background:var(--accent);color:#000}
#character-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;overflow:auto;flex:1}
.char-card{background:var(--card);border:1px solid #222;border-radius:12px;padding:8px;text-align:center}
.char-card .portrait{width:100%;aspect-ratio:1;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#666}
.char-card .name{font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-card .tier{font-size:10px;color:var(--accent)}
.battle-hud{display:flex;justify-content:space-between;padding:10px;align-items:center}
.fighter{width:40%}
.hp{height:10px;background:#333;border-radius:5px;overflow:hidden;margin:4px 0}
.hp .bar{height:100%;width:100%;background:linear-gradient(90deg,#ff0000,#ff5a00);transition:width .2s}
.vs{font-weight:900;color:#666}
#battle-canvas{flex:1;background:linear-gradient(#0d0000,#000);border-top:1px solid #222;border-bottom:1px solid #222}
.controls{display:flex;justify-content:space-between;padding:10px}
.controls .left,.controls .right{display:flex;gap:12px}
.controls button{width:64px;height:64px;border-radius:50%;font-size:22px;background:#111;border:1px solid #333}
#ability-log{height:40px;padding:4px 10px;font-size:12px;color:#ff9d66;text-align:center;overflow:hidden}
.back{background:none;border:none;color:#fff;font-size:20px;padding:0 10px}

.mascot{background:#111 url('data:image/jpeg;base64,') center/cover}
</style>
</head>
<body>
<div id="app">
  <div id="main-menu" class="screen active">
    <div class="logo">NINJA <span>BALL</span></div>
    <div class="mascot" style="width:140px;height:140px;margin:20px auto;border-radius:50%;border:2px solid #ff450033;background:#222;display:flex;align-items:center;justify-content:center;color:#666;font-size:12px">NINJA</div>
    <div class="buttons">
      <button onclick="showScreen('play')">PLAY</button>
      <button onclick="showScreen('characters')">CHARACTERS</button>
      <button onclick="showScreen('battle')">BATTLE</button>
      <button onclick="alert('Multiplayer keyinroq')">MULTIPLAYER</button>
      <button onclick="alert('Settings')">SETTINGS</button>
      <button onclick="alert('Profile')">PROFILE</button>
    </div>
    <div class="footer">v1.2 • 118 CHARACTERS</div>
  </div>

  <div id="play-screen" class="screen">
    <header><button class="back" onclick="showScreen('main')">←</button><h2>ADVENTURE</h2></header>
    <div id="season-tabs"></div>
    <div id="level-grid"></div>
  </div>

  <div id="characters-screen" class="screen">
    <header><button class="back" onclick="showScreen('main')">←</button><h2>CHARACTERS (118)</h2><div class="filters"><button onclick="filter('S')">S</button><button onclick="filter('A')">A</button><button onclick="filter('B')">B</button><button onclick="filter('C')">C</button><button onclick="filter('ALL')" class="active">ALL</button></div></header>

  </div>

  <div id="battle-screen" class="screen">

    <div class="controls"><div class="left"><button>◀</button><button>▶</button></div><div class="right"><button>⤒</button><button onclick="useAbility()">⚡</button></div></div>
    <div id="ability-log"></div>
  </div>
</div>

const MAX_HP=300;
let currentFilter='ALL';
let p1={hp:MAX_HP,char:null,lastAbility:null},p2={hp:MAX_HP,char:null,lastAbility:null};

function showScreen(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(n==='main'?'main-menu':n+'-screen').classList.add('active');if(n==='characters')renderCharacters();if(n==='battle')startBattle();if(n==='play')renderSeasons();}
function renderCharacters(){const g=document.getElementById('character-grid');g.innerHTML='';characters.filter(c=>currentFilter==='ALL'||c.tier===currentFilter).sort((a,b)=>a.tier.localeCompare(b.tier)||a.rank-b.rank).forEach(c=>{const d=document.createElement('div');d.className='char-card';d.innerHTML=`<div class="portrait">${c.id}</div><div class="name">${c.name}</div><div class="tier">${c.tier} #${c.rank}</div>`;d.onclick=()=>alert(c.name+' - '+c.abilities.length+' abilities');g.appendChild(d);});}
function filter(t){currentFilter=t;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b.textContent===t));renderCharacters();}

const SEASONS=[{id:1,name:'Fire'},{id:2,name:'Ice'},{id:3,name:'Shadow'},{id:4,name:'Storm'}];
let progress=JSON.parse(localStorage.getItem('nb')||'{}');if(!progress.levels){progress={levels:{}};SEASONS.forEach(s=>{progress.levels[s.id]={};for(let i=1;i<=10;i++)progress.levels[s.id][i]=false});}
function renderSeasons(){const t=document.getElementById('season-tabs');t.innerHTML='';SEASONS.forEach((s,i)=>{const b=document.createElement('button');b.className='season-tab'+(i===0?' active':'');b.textContent=s.name+' Season';b.onclick=()=>{document.querySelectorAll('.season-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderLevels(s.id)};t.appendChild(b)});renderLevels(1);}
function renderLevels(sid){const g=document.getElementById('level-grid');g.innerHTML='';for(let i=1;i<=10;i++){const done=progress.levels[sid][i];const boss=i===10;const unlock=!boss||[...Array(9)].every((_,k)=>progress.levels[sid][k+1]);const c=document.createElement('div');c.className='level-card'+(boss?' boss':'')+(done?' completed':'')+(!unlock?' locked':'');c.innerHTML=`<div class="num">${i}</div><div class="status">${boss?'BOSS':done?'CLEAR':''}</div>`;if(unlock)c.onclick=()=>{progress.levels[sid][i]=true;localStorage.setItem('nb',JSON.stringify(progress));renderLevels(sid)};g.appendChild(c)}}
function startBattle(){p1.char=characters.find(c=>c.tier==='S');p2.char=characters.find(c=>c.tier==='C');p1.hp=p2.hp=MAX_HP;updateHP();document.getElementById('c1').textContent=p1.char.name;document.getElementById('c2').textContent=p2.char.name;log('Battle start');}
function updateHP(){document.getElementById('hp1').style.width=p1.hp/3+'%';document.getElementById('hp2').style.width=p2.hp/3+'%';}
function log(t){document.getElementById('ability-log').textContent=t;}
function useAbility(){const a=p1.char;let abil;if(a.tier==='C'){do{abil=a.abilities[Math.floor(Math.random()*a.abilities.length)]}while(abil.name===p1.lastAbility);p1.lastAbility=abil.name}else{abil=a.abilities[0]}p2.hp=Math.max(0,p2.hp-abil.damage);updateHP();log(a.name+' → '+abil.name+' -'+abil.damage);if(p2.hp<=0)log('VICTORY!');}
renderCharacters();
